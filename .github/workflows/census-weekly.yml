name: census-weekly
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: full census
        env:
          MR_UA: modrinthranker/1.0 (https://github.com/NullTronPrime/modrinthranker; contact via repo issues)
          MR_RPM: "90"
          MR_TOP_N: "400"
        run: python modrinth_ranker.py --full
      - name: publish census
        run: |
          git config user.name "modrinthranker bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "weekly census"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
