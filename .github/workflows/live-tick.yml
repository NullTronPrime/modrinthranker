name: live-tick
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: census
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore database
        uses: actions/cache@v4
        with:
          path: data
          key: ranks-${{ github.run_id }}
          restore-keys: ranks-
      - name: live tick
        env:
          MR_UA: modrinthranker/1.0 (https://github.com/NullTronPrime/modrinthranker; contact via repo issues)
          MR_RPM: "90"
          MR_TOP_N: "50"
        run: python modrinth_ranker.py --live
      - name: publish tick
        run: |
          git config user.name "modrinthranker bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "live tick"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
