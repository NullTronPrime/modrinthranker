name: census-hourly
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: census
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore census database
        id: db
        uses: actions/cache@v4
        with:
          path: data/ranks.sqlite.gz
          key: census-db-${{ github.run_id }}
          restore-keys: census-db-
      - name: decompress
        if: steps.db.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          if [ -f data/ranks.sqlite.gz ]; then
            gunzip -k data/ranks.sqlite.gz
          else
            echo "no cached database, starting cold"
          fi
      - name: refresh top 5000 and one tail slice
        env:
          MR_UA: modrinthranker/1.0 (https://github.com/NullTronPrime/modrinthranker; contact via repo issues)
          MR_RPM: "240"
          MR_TOP_N: "5000"
          MR_SLICES: "24"
          MR_DEP_TOP: "20000"
        run: |
          if [ ! -s data/ranks.sqlite ]; then
            python modrinth_ranker.py --full
          else
            python modrinth_ranker.py --hourly
          fi
      - name: compress
        run: gzip -9 -f data/ranks.sqlite
      - name: save census database
        uses: actions/cache/save@v4
        with:
          path: data/ranks.sqlite.gz
          key: census-db-${{ github.run_id }}
      - name: publish
        run: |
          git config user.name "modrinthranker bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "hourly census"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
