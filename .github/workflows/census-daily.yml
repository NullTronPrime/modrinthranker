name: census-daily
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: census
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore census database
        id: db
        uses: actions/cache@v4
        with:
          path: data/ranks.sqlite.gz
          key: census-db-${{ github.run_id }}
          restore-keys: census-db-
      - name: decompress
        run: |
          mkdir -p data
          if [ -f data/ranks.sqlite.gz ]; then gunzip -k data/ranks.sqlite.gz; fi
      - name: full publish
        env:
          MR_UA: modrinthranker/1.0 (https://github.com/NullTronPrime/modrinthranker; contact via repo issues)
          MR_RPM: "240"
        run: |
          if [ ! -s data/ranks.sqlite ]; then
            echo "no census database cached yet, census-weekly builds it; nothing to do"
          else
            python modrinth_ranker.py --emit
          fi
      - name: compress
        run: gzip -9 -f data/ranks.sqlite || true
      - name: save census database
        uses: actions/cache/save@v4
        with:
          path: data/ranks.sqlite.gz
          key: census-db-${{ github.run_id }}
      - name: publish
        run: |
          git config user.name "modrinthranker bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "daily census"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
